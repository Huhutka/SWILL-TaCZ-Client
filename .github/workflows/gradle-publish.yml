name: Build SWILL-TaCZ Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Make gradlew executable
      run: chmod +x gradlew
    - name: Build
      run: ./gradlew build --no-daemon
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: SWILL-TaCZ-Client
        path: build/libs/*.jar
